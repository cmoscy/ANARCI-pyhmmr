[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anarci"
version = "1.3"
description = "Antibody Numbering and Receptor ClassIfication"
authors = [{ name = "James Dunbar", email = "opig@stats.ox.ac.uk" }]
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.8"
dependencies = [
    "pyhmmer",
]

[project.scripts]
ANARCI = "anarci.cli:main"

[tool.setuptools.packages.find]
where = ["lib/python"]

[tool.setuptools.package-data]
anarci = [
    "dat/HMMs/ALL.hmm",
    "dat/HMMs/ALL.hmm.h3f",
    "dat/HMMs/ALL.hmm.h3i",
    "dat/HMMs/ALL.hmm.h3m",
    "dat/HMMs/ALL.hmm.h3p",
    "germlines.py",
]
